# The live suite talks to the real Beatport API and needs credentials
# (BEATPORT_USERNAME and BEATPORT_PASSWORD, or BPCAT_CREDENTIALS for the
# download suite). Live-tagged tests are skipped by default so the normal
# run stays offline:
#   flutter test                              unit tests only
#   flutter test --tags live --run-skipped    include the live suite
tags:
  live:
    skip: "needs Beatport credentials; run with --tags live --run-skipped"
  # Performance probes. They build six-figure queues and take minutes, so they
  # stay out of the normal run:
  #   flutter test --tags bench --run-skipped
  bench:
    skip: "performance probe; run with --tags bench --run-skipped"
